{% extends 'main/base.html' %}

{% block title %}Kullanım Kılavuzu{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-6 py-12 relative z-10 text-center">
    <div class="glass-card rounded-2xl p-12">
        <div class="w-20 h-20 mx-auto bg-indigo-500/20 rounded-full flex items-center justify-center mb-6 text-indigo-400 text-4xl">
            <i class="fas fa-book-open"></i>
        </div>
        <h1 class="text-3xl md:text-5xl font-bold mb-4 text-white">
            Kullanım Kılavuzu
        </h1>
        <p class="text-slate-400 mb-8 text-lg">
            Rumep fontları ve araçlarının nasıl kullanılacağına dair detaylı rehberler ve dokümantasyon çok yakında bu sayfada olacak.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'font_list' %}" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-xl font-medium transition-all">
                Fontları İncele
            </a>
            <a href="{% url 'contact' %}" class="bg-white/10 hover:bg-white/20 text-white px-8 py-3 rounded-xl font-medium transition-all border border-white/10">
                Bize Ulaşın
            </a>
        </div>
    </div>
</div>
{% endblock %}
